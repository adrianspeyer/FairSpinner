name: Feature request
description: Suggest an improvement to FairSpin.
body:
  - type: markdown
    attributes:
      value: Please describe your use case without real participant data or private draw details.
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
      description: Describe the problem or task you want to make easier.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested behavior
      description: Describe the improvement and any alternatives you have considered.
    validations:
      required: true
